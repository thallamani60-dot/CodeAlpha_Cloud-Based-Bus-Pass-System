{% extends 'base.html' %}{% block content %}<div class="auth-card card p-4 mx-auto"><h1 class="h3">Apply for a bus pass</h1><p>The fare is calculated from administrator-configured rules.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label">Route</label><select class="form-select mb-3" name="route_id" required>{% for r in routes %}<option value="{{ r.id }}">{{ r.code }} · {{ r.name }} ({{ r.origin }} → {{ r.destination }})</option>{% endfor %}</select><label class="form-label">Pass type</label><select class="form-select mb-3" name="pass_type_id" required>{% for t in types %}<option value="{{ t.id }}">{{ t.category|title }} · {{ t.duration|title }} ({{ t.duration_days }} days)</option>{% endfor %}</select><button class="btn btn-primary w-100">Continue to fare</button></form></div>{% endblock %}
